<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="none">
  <defs>
    <linearGradient id="pearl" x2="1" y2="0">
      <stop stop-color="#e7f5f6" stop-opacity=".28"/><stop offset=".12" stop-color="#a1f3ff" stop-opacity=".035"/>
      <stop offset=".5" stop-color="#d5eff2" stop-opacity=".15"/><stop offset=".88" stop-color="#a1f3ff" stop-opacity=".035"/><stop offset="1" stop-color="#e7f5f6" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="cove" x2="1" y2="0">
      <stop stop-color="#92edf3" stop-opacity=".5"/><stop offset=".26" stop-color="#eaffff" stop-opacity="1"/>
      <stop offset=".5" stop-color="#c4f5ff" stop-opacity=".7"/><stop offset=".74" stop-color="#eaffff" stop-opacity="1"/><stop offset="1" stop-color="#92edf3" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="deck" x2="0" y2="1">
      <stop stop-color="#e4f7ff" stop-opacity=".12"/><stop offset=".45" stop-color="#a8e5ee" stop-opacity=".03"/><stop offset="1" stop-color="#122432" stop-opacity=".09"/>
    </linearGradient>
    <radialGradient id="port" cx="0" cy=".5" r="1">
      <stop stop-color="#b4f7ff" stop-opacity=".21"/><stop offset=".65" stop-color="#92e3f5" stop-opacity=".05"/><stop offset="1" stop-color="#92e3f5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="starboard" cx="1" cy=".5" r="1">
      <stop stop-color="#b4f7ff" stop-opacity=".21"/><stop offset=".65" stop-color="#92e3f5" stop-opacity=".05"/><stop offset="1" stop-color="#92e3f5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" patternUnits="userSpaceOnUse" width="56" height="5">
      <path d="M0 .5H39M42 3H56" stroke="#d9edf3" stroke-width=".45" stroke-opacity=".018"/>
    </pattern>
    <clipPath id="structure">
      <path d="M0 0H1600V1000H0ZM155 50 112 96 172 720H1428L1488 96 1445 50Z" fill-rule="evenodd"/>
    </clipPath>
  </defs>
  <!-- Finishes and light pools stay on the cabin. The window remains clear. -->
  <g clip-path="url(#structure)">
    <path d="M0 0H1600V738H0Z" fill="url(#pearl)"/>
    <path d="M0 35H160V731H0Z" fill="url(#port)"/>
    <path d="M1440 35H1600V731H1440Z" fill="url(#starboard)"/>
    <path d="M178 722H1422L1494 795H1191Q1176 795 1140 828H459Q429 795 405 795H104Z" fill="url(#deck)"/>
    <path d="M0 0H1600V33H0ZM0 180 100 205 144 680 81 693 0 548ZM1600 180 1500 205 1456 680 1519 693 1600 548ZM185 728H1415L1461 779H139Z" fill="url(#grain)"/>
  </g>
  <!-- Recessed cove: a feathered halo, metal channel and thin luminous core. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M126 60 151 30H1449L1474 60" stroke="#9debfa" stroke-opacity=".018" stroke-width="31"/>
    <path d="M126 60 151 30H1449L1474 60" stroke="#9debfa" stroke-opacity=".075" stroke-width="16"/>
    <path d="M126 60 151 30H1449L1474 60" stroke="#0c2736" stroke-opacity=".6" stroke-width="5"/>
    <path d="M126 60 151 30H1449L1474 60" stroke="url(#cove)" stroke-width="2"/>
    <path d="M126 58 151 28H1449L1474 58" stroke="#d6e9ed" stroke-opacity=".3" stroke-width=".8"/>
    <!-- Illuminated edge rebates, offset from the warm wall fixtures. -->
    <path d="M77 195 112 558M1523 195 1488 558" stroke="#74dded" stroke-opacity=".04" stroke-width="22"/>
    <path d="M77 195 112 558M1523 195 1488 558" stroke="#102b3b" stroke-opacity=".5" stroke-width="4"/>
    <path d="M77 195 112 558M1523 195 1488 558" stroke="#c3fbff" stroke-opacity=".55" stroke-width="1.3"/>
    <path d="M179 747H406M1194 747H1421" stroke="#223843" stroke-opacity=".22" stroke-width="1.5"/>
    <path d="M179 749H406M1194 749H1421" stroke="#eaf6fa" stroke-opacity=".28" stroke-width=".8"/>
    <!-- The lower sill catches the existing screen light. -->
    <path d="M483 942H1117" stroke="#9fe9ed" stroke-opacity=".09" stroke-width="10"/>
    <path d="M483 942H1117" stroke="#d0f8fa" stroke-opacity=".42" stroke-width="1.2"/>
  </g>
</svg>
