name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.2
      - run: npm ci
      - run: npm test && npm run lint && npm run format:check && npm run build
      - run: npm audit --audit-level=moderate
